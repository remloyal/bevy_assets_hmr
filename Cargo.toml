[package]
name = "bevy_assets_hmr"
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
description = "Minimal config-file hot-reload for Bevy 0.20: watch a RON/JSON (or custom-format) file and read it from a Resource anywhere."
license = "MIT"
authors = ["remloyal <remloyal@163.com>"]
readme = "README.md"
homepage = "https://github.com/remloyal/bevy_assets_hmr"
repository = "https://github.com/remloyal/bevy_assets_hmr"
keywords = ["bevy", "hmr", "hot-reload", "config", "ron"]
categories = ["game-development"]

[dependencies]
bevy = { version = "0.20.0", default-features = false, features = [
    "std",
    "bevy_log",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ron = "0.12.2"

[dev-dependencies]
# `default-features = false` keeps example/test builds light: the crate only
# needs `MinimalPlugins`, which comes from the always-present `bevy_app`.
bevy = { version = "0.20.0", default-features = false, features = [
    "std",
    "bevy_log",
] }

[[example]]
name = "simplest"
path = "examples/simplest.rs"

[[example]]
name = "live_watch"
path = "examples/live_watch.rs"

[[example]]
name = "formats"
path = "examples/formats.rs"
